spring.application.name=backend
server.port=8081

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:hireready;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.generate-unique-name=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# SQL Initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
hireready.jwt.secret=YourSuperSecretKeyThatShouldBeLongEnoughToMeetTheRequirementOf256Bits
hireready.jwt.expiration=86400000

# Ollama Endpoint
ollama.base-url=http://localhost:11434/api/generate
